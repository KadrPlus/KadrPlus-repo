name: Release Kadr+ 2.0.99

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-2099.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build, validate and publish Kadr+ 2.0.99
        shell: bash
        run: |
          set -euo pipefail

          cat .release/2099/patch.* > /tmp/es_patch.b64
          echo "8e5e142a1d0bc0a1e7276ba6fde4aebf0d5e55d50f490674ca120370db63f7ff  /tmp/es_patch.b64" | sha256sum -c -
          base64 -d /tmp/es_patch.b64 | gzip -d > /tmp/es.patch
          echo "5e4c7fc77a50ca72388502d6eb58826ca2214383c208aa591fbd78cd4bc72d3a  /tmp/es.patch" | sha256sum -c -

          rm -rf /tmp/kadr2099
          mkdir -p /tmp/kadr2099
          unzip -q zips/plugin.video.kadrplus2/plugin.video.kadrplus2-2.0.98.zip -d /tmp/kadr2099
          ROOT=/tmp/kadr2099/plugin.video.kadrplus2

          (
            cd "$ROOT"
            sha256sum lib/sources/tg/telegram.py resources/lib/tg_stream_service.py lib/sources/de/*.py
          ) > /tmp/guards.before

          (
            cd "$ROOT"
            patch -p1 < /tmp/es.patch
          )

          python3 - <<'PY'
          from pathlib import Path
          p=Path("/tmp/kadr2099/plugin.video.kadrplus2/addon.xml")
          s=p.read_text(encoding="utf-8")
          old='version="2.0.98"'
          new='version="2.0.99"'
          if old not in s:
              raise SystemExit("2.0.98 version marker not found after patch")
          p.write_text(s.replace(old,new,1),encoding="utf-8")
          PY

          (
            cd "$ROOT"
            sha256sum lib/sources/tg/telegram.py resources/lib/tg_stream_service.py lib/sources/de/*.py
          ) > /tmp/guards.after
          diff -u /tmp/guards.before /tmp/guards.after

          python3 - <<'PY'
          from pathlib import Path
          import ast
          import xml.etree.ElementTree as ET

          root=Path("/tmp/kadr2099/plugin.video.kadrplus2")

          py=list(root.rglob("*.py"))
          for p in py:
              ast.parse(p.read_text(encoding="utf-8-sig"), filename=str(p), feature_version=(3,8))

          xmls=list(root.rglob("*.xml"))
          for p in xmls:
              ET.parse(p)

          langs={}
          for lang in ["en_gb","pl_pl","de_de","es_es"]:
              p=root/f"resources/language/resource.language.{lang}/strings.po"
              ids=[
                  line.split("#",1)[1].split('"',1)[0]
                  for line in p.read_text(encoding="utf-8-sig").splitlines()
                  if line.startswith('msgctxt "#')
              ]
              langs[lang]=ids
          if {k:len(v) for k,v in langs.items()} != {"en_gb":1074,"pl_pl":1074,"de_de":1074,"es_es":1074}:
              raise SystemExit(f"PO count mismatch: {{k:len(v) for k,v in langs.items()}}")
          if len({frozenset(v) for v in langs.values()}) != 1:
              raise SystemExit("PO ID sets differ")

          settings=ET.parse(root/"resources/settings.xml").getroot()
          ids=[x.get("id") for x in settings.iter("setting") if x.get("id")]
          if len(ids) != 413 or len(set(ids)) != 413:
              raise SystemExit(f"settings IDs mismatch: {len(ids)}/{len(set(ids))}")

          junk=[
              str(p) for p in root.rglob("*")
              if p.name=="__pycache__" or p.name.endswith((".pyc",".pyo",".orig",".rej"))
          ]
          if junk:
              raise SystemExit(f"junk files: {junk[:10]}")

          addon=ET.parse(root/"addon.xml").getroot()
          if addon.get("version") != "2.0.99":
              raise SystemExit(f"wrong addon version: {addon.get('version')}")

          for name in ["cinecalidad","entrepeliculasyseries","gnula","pelispedia","verpeliculasonline"]:
              if not (root/f"lib/sources/es/{name}.py").is_file():
                  raise SystemExit(f"missing ES provider: {name}")

          print(f"VALIDATION PASS: py={len(py)} xml={len(xmls)} settings={len(ids)}")
          PY

          rm -f /tmp/plugin.video.kadrplus2-2.0.99.zip
          (
            cd /tmp/kadr2099
            zip -qr /tmp/plugin.video.kadrplus2-2.0.99.zip plugin.video.kadrplus2
          )

          python3 - <<'PY'
          import zipfile, xml.etree.ElementTree as ET, io
          from pathlib import Path
          zp=Path("/tmp/plugin.video.kadrplus2-2.0.99.zip")
          with zipfile.ZipFile(zp) as z:
              if z.testzip() is not None:
                  raise SystemExit("ZIP test failed")
              tops={n.split("/",1)[0] for n in z.namelist() if n}
              if tops != {"plugin.video.kadrplus2"}:
                  raise SystemExit(f"bad ZIP roots: {tops}")
              addon=ET.parse(io.BytesIO(z.read("plugin.video.kadrplus2/addon.xml"))).getroot()
              if addon.get("version") != "2.0.99":
                  raise SystemExit("ZIP addon version mismatch")
          print("ZIP PASS")
          PY

          python3 update_repo.py /tmp/plugin.video.kadrplus2-2.0.99.zip
          python3 update_repo.py --check

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse("addons.xml").getroot()
          found=None
          for addon in root.findall("addon"):
              if addon.get("id")=="plugin.video.kadrplus2":
                  found=addon
                  break
          if found is None:
              raise SystemExit("plugin.video.kadrplus2 missing from addons.xml")
          if found.get("version")!="2.0.99":
              raise SystemExit(f"addons.xml version mismatch: {found.get('version')}")
          labels=[x.get("lang") for x in found.findall(".//summary")]
          if "es" not in labels:
              raise SystemExit("Spanish addon metadata missing from addons.xml")
          print("REPO METADATA PASS")
          PY

          ZIP=zips/plugin.video.kadrplus2/plugin.video.kadrplus2-2.0.99.zip
          echo "REMOTE_ZIP_SHA256=$(sha256sum "$ZIP" | awk '{print $1}')"
          echo "REMOTE_ZIP_SIZE=$(stat -c '%s' "$ZIP")"

          git rm -r .release/2099 .github/workflows/release-2099.yml .github/workflows/diag-2099.yml
          git add addons.xml addons.xml.md5 zips/plugin.video.kadrplus2

          git config user.name "KadrPlus Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update Kadr+ to 2.0.99"
          git push origin main
