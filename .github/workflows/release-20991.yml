name: Release Kadr+ 2.0.99.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-20991.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build, validate and publish 2.0.99.1
        shell: bash
        run: |
          set -euo pipefail
          SRC="zips/plugin.video.kadrplus2/plugin.video.kadrplus2-2.0.99.zip"
          DST="zips/plugin.video.kadrplus2/plugin.video.kadrplus2-2.0.99.1.zip"
          test -f "$SRC"

          rm -rf /tmp/kadr20991
          mkdir -p /tmp/kadr20991
          unzip -q "$SRC" -d /tmp/kadr20991
          ROOT="/tmp/kadr20991/plugin.video.kadrplus2"
          test -f "$ROOT/addon.xml"

          TG_BEFORE="$(sha256sum "$ROOT/lib/sources/tg/telegram.py" | awk '{print $1}')"
          TGS_BEFORE="$(sha256sum "$ROOT/resources/lib/tg_stream_service.py" | awk '{print $1}')"
          find "$ROOT/lib/sources/de" -maxdepth 1 -type f -name '*.py' -print0 | sort -z | xargs -0 sha256sum > /tmp/de-before.sha

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("/tmp/kadr20991/plugin.video.kadrplus2")

          p = root / "addon.xml"
          s = p.read_text(encoding="utf-8")
          if 'version="2.0.99"' not in s:
              raise SystemExit("Expected 2.0.99 baseline not found")
          s = s.replace('version="2.0.99"', 'version="2.0.99.1"', 1)
          p.write_text(s, encoding="utf-8")

          p = root / "resources/settings.xml"
          s = p.read_text(encoding="utf-8")
          for unexpected in ("provider.cinecalidad", "provider.gnula", "provider.entrepeliculasyseries"):
              if unexpected in s:
                  raise SystemExit(f"Baseline already contains ES setting {unexpected}")

          needle = """                <setting id="verpeliculasonline.sort.order" label="32734" type="integer" parent="provider.verpeliculasonline" help="">
                              <level>0</level>
                              <default>0</default>
                              <constraints>
                                  <minimum>0</minimum>
                                  <step>1</step>
                                  <maximum>99</maximum>
                              </constraints>
                              <dependencies>
                                  <dependency type="visible" setting="provider.verpeliculasonline">true</dependency>
                              </dependencies>
                              <control type="slider" format="integer"><popup>false</popup></control>
                          </setting>
          """
          if needle not in s:
              raise SystemExit("ES settings insertion anchor not found")

          extra = """                <setting id="provider.cinecalidad" label="33443" type="boolean" help="">
                              <level>0</level>
                              <default>true</default>
                              <control type="toggle" />
                          </setting>
                          <setting id="cinecalidad.sort.order" label="32734" type="integer" parent="provider.cinecalidad" help="">
                              <level>0</level>
                              <default>0</default>
                              <constraints>
                                  <minimum>0</minimum>
                                  <step>1</step>
                                  <maximum>99</maximum>
                              </constraints>
                              <dependencies>
                                  <dependency type="visible" setting="provider.cinecalidad">true</dependency>
                              </dependencies>
                              <control type="slider" format="integer">
                                  <popup>false</popup>
                              </control>
                          </setting>
                          <setting id="provider.gnula" label="33444" type="boolean" help="">
                              <level>0</level>
                              <default>true</default>
                              <control type="toggle" />
                          </setting>
                          <setting id="gnula.sort.order" label="32734" type="integer" parent="provider.gnula" help="">
                              <level>0</level>
                              <default>0</default>
                              <constraints>
                                  <minimum>0</minimum>
                                  <step>1</step>
                                  <maximum>99</maximum>
                              </constraints>
                              <dependencies>
                                  <dependency type="visible" setting="provider.gnula">true</dependency>
                              </dependencies>
                              <control type="slider" format="integer">
                                  <popup>false</popup>
                              </control>
                          </setting>
                          <setting id="provider.entrepeliculasyseries" label="33445" type="boolean" help="">
                              <level>0</level>
                              <default>true</default>
                              <control type="toggle" />
                          </setting>
                          <setting id="entrepeliculasyseries.sort.order" label="32734" type="integer" parent="provider.entrepeliculasyseries" help="">
                              <level>0</level>
                              <default>0</default>
                              <constraints>
                                  <minimum>0</minimum>
                                  <step>1</step>
                                  <maximum>99</maximum>
                              </constraints>
                              <dependencies>
                                  <dependency type="visible" setting="provider.entrepeliculasyseries">true</dependency>
                              </dependencies>
                              <control type="slider" format="integer">
                                  <popup>false</popup>
                              </control>
                          </setting>
          """
          s = s.replace(needle, needle + extra, 1)
          p.write_text(s, encoding="utf-8")

          translations = {
              "en_gb": ("Source services ES", "Source services ES"),
              "pl_pl": ("Source services ES", "Serwisy źródeł ES"),
              "de_de": ("Source services ES", "Spanische Quellenanbieter"),
              "es_es": ("Source services ES", "Servicios de fuentes ES"),
          }
          for lang, (msgid, msgstr) in translations.items():
              p = root / f"resources/language/resource.language.{lang}/strings.po"
              s = p.read_text(encoding="utf-8")
              pattern = r'msgctxt "#33425"\nmsgid "Spanish sources"\nmsgstr "[^"]*"'
              replacement = f'msgctxt "#33425"\nmsgid "{msgid}"\nmsgstr "{msgstr}"'
              s, count = re.subn(pattern, replacement, s, count=1)
              if count != 1:
                  raise SystemExit(f"33425 block not found for {lang}")
              anchor = 'msgctxt "#33427"\nmsgid "VerPeliculasOnline"\nmsgstr "VerPeliculasOnline"\n'
              if anchor not in s:
                  raise SystemExit(f"33427 anchor not found for {lang}")
              addition = (
                  '\nmsgctxt "#33443"\nmsgid "CineCalidad"\nmsgstr "CineCalidad"\n'
                  '\nmsgctxt "#33444"\nmsgid "GnulaHD"\nmsgstr "GnulaHD"\n'
                  '\nmsgctxt "#33445"\nmsgid "EntrePeliculasySeries"\nmsgstr "EntrePeliculasySeries"\n'
              )
              s = s.replace(anchor, anchor + addition, 1)
              p.write_text(s, encoding="utf-8")
          PY

          python3 - <<'PY'
          from pathlib import Path
          import ast, re, xml.etree.ElementTree as ET

          root = Path("/tmp/kadr20991/plugin.video.kadrplus2")

          py_files = list(root.rglob("*.py"))
          for p in py_files:
              ast.parse(p.read_text(encoding="utf-8-sig"), filename=str(p), feature_version=(3, 8))
          print("PY_AST", len(py_files), "PASS")

          xml_files = list(root.rglob("*.xml"))
          for p in xml_files:
              ET.parse(p)
          print("XML", len(xml_files), "PASS")

          addon = ET.parse(root / "addon.xml").getroot()
          assert addon.get("version") == "2.0.99.1"

          settings = ET.parse(root / "resources/settings.xml").getroot()
          ids = [x.get("id") for x in settings.iter("setting") if x.get("id")]
          assert len(ids) == 419 == len(set(ids))
          for sid in (
              "provider.pelispedia", "pelispedia.sort.order",
              "provider.verpeliculasonline", "verpeliculasonline.sort.order",
              "provider.cinecalidad", "cinecalidad.sort.order",
              "provider.gnula", "gnula.sort.order",
              "provider.entrepeliculasyseries", "entrepeliculasyseries.sort.order",
          ):
              assert sid in ids, sid
          cat = settings.find(".//category[@id='essources']")
          assert cat is not None and cat.get("label") == "33425"
          print("SETTINGS", len(ids), "unique PASS")

          sets = []
          for lang in ("en_gb", "pl_pl", "de_de", "es_es"):
              text = (root / f"resources/language/resource.language.{lang}/strings.po").read_text(encoding="utf-8-sig")
              ids_set = set(re.findall(r'^msgctxt "#(\d+)"$', text, re.M))
              assert "33425" in ids_set and "33443" in ids_set and "33444" in ids_set and "33445" in ids_set
              assert 'msgid "Source services ES"' in text
              sets.append(ids_set)
              print(lang, len(ids_set))
          assert all(x == sets[0] for x in sets[1:])
          assert len(sets[0]) == 1077
          print("PO_PARITY 1077 PASS")

          providers = sorted(
              p.stem for p in (root / "lib/sources/es").glob("*.py")
              if not p.name.startswith("_")
          )
          assert providers == ["cinecalidad", "entrepeliculasyseries", "gnula", "pelispedia", "verpeliculasonline"]
          print("ES_PROVIDERS_5 PASS")

          junk = [
              p for p in root.rglob("*")
              if "__pycache__" in p.parts or p.suffix in {".pyc", ".pyo", ".orig", ".rej"}
          ]
          assert not junk, junk
          PY

          TG_AFTER="$(sha256sum "$ROOT/lib/sources/tg/telegram.py" | awk '{print $1}')"
          TGS_AFTER="$(sha256sum "$ROOT/resources/lib/tg_stream_service.py" | awk '{print $1}')"
          test "$TG_BEFORE" = "$TG_AFTER"
          test "$TGS_BEFORE" = "$TGS_AFTER"
          find "$ROOT/lib/sources/de" -maxdepth 1 -type f -name '*.py' -print0 | sort -z | xargs -0 sha256sum > /tmp/de-after.sha
          diff -u /tmp/de-before.sha /tmp/de-after.sha
          echo "Telegram + DE guards PASS"

          rm -f "$DST"
          (
            cd /tmp/kadr20991
            zip -qr "$GITHUB_WORKSPACE/$DST" plugin.video.kadrplus2
          )

          python3 update_repo.py
          python3 update_repo.py --check

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, zipfile, xml.etree.ElementTree as ET

          z = Path("zips/plugin.video.kadrplus2/plugin.video.kadrplus2-2.0.99.1.zip")
          with zipfile.ZipFile(z) as f:
              assert f.testzip() is None
              roots = {n.split("/", 1)[0] for n in f.namelist() if n}
              assert roots == {"plugin.video.kadrplus2"}
              manifest = ET.fromstring(f.read("plugin.video.kadrplus2/addon.xml"))
              assert manifest.get("version") == "2.0.99.1"
          repo = ET.parse("addons.xml").getroot()
          addon = repo.find("./addon[@id='plugin.video.kadrplus2']")
          assert addon is not None and addon.get("version") == "2.0.99.1"
          md5 = hashlib.md5(Path("addons.xml").read_bytes()).hexdigest()
          assert Path("addons.xml.md5").read_text().strip() == md5
          print("ZIP_SHA256", hashlib.sha256(z.read_bytes()).hexdigest())
          print("ZIP_SIZE", z.stat().st_size)
          print("ADDONS_MD5", md5)
          print("REPO FINAL VALIDATION PASS")
          PY

          rm -f .github/workflows/release-20991.yml
          rm -f .github/workflows/diag-2099.yml

          git config user.name "Kadr+"
          git config user.email "gultupirtu@gmail.com"
          git add -A
          git status --short
          git diff --cached --quiet && { echo "No release changes to commit"; exit 1; }
          git commit -m "Update Kadr+ to 2.0.99.1"
          git push origin main
